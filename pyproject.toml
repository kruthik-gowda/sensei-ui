[project]
name = "sensei-ui"
version = "0.1.0"
description = "Web UI for triaging, editing, and posting Sensei code-review findings"
requires-python = ">=3.9"
dependencies = [
    "sensei-review",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "unidiff>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sensei-ui = "sensei_ui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
